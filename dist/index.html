<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11120f" />
  <meta name="description" content="A visual idle factory game with machines, conveyor belts, and automated production." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2311120f'/%3E%3Cpath d='M10 49V27l13 7V23l13 7V15h10v34z' fill='%23d7ff43'/%3E%3C/svg%3E" />
  <title>SHIFT — Idle Factory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <header class="topbar">
      <a class="brand" href="#" aria-label="SHIFT factory home"><span>S</span> SHIFT</a>
      <div class="balance"><small>CASH</small><strong id="money">$0</strong></div>
      <div class="rate"><small>OUTPUT</small><strong id="perSecond">$0/sec</strong></div>
      <button class="reset" id="resetButton" aria-label="Reset progress" title="Reset progress">↻</button>
    </header>

    <section class="factory" id="factory" aria-label="Interactive factory floor">
      <img src="assets/factory-floor.png" alt="A compact factory with four machines connected by conveyor belts" />
      <div class="shade" aria-hidden="true"></div>
      <div class="machine-layer" id="machineLayer"></div>
      <div class="crate-track" id="crateTrack" aria-hidden="true"></div>
      <button class="run-button" id="crankButton"><span>RUN LINE</span><small>+<b id="tapValue">$1</b></small></button>
      <div class="float-layer" id="floatLayer" aria-hidden="true"></div>
      <div class="hint" id="hint">Tap a machine to build it</div>
    </section>

    <section class="dock">
      <article class="contract">
        <div><small>ORDER</small><strong id="contractName">FIRST BATCH</strong></div>
        <div class="contract-progress"><span><i id="contractFill"></i></span><small id="contractProgress">$0 / $100</small></div>
        <button id="claimButton" disabled>CLAIM <b id="contractReward">+$40</b></button>
      </article>
      <button class="boost" id="globalUpgrade"><span><small>FACTORY BOOST</small>ALL MACHINES +25%</span><b id="upgradeCost">$250</b></button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="resetModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
      <small>RESET FACTORY</small><h2 id="resetTitle">Start over?</h2><p>This clears all machines and output.</p>
      <div><button id="cancelReset">CANCEL</button><button class="danger" id="confirmReset">RESET</button></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
