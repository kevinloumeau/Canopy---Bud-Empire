<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13241c">
<title>Canopy v2 · Campus prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ground:#13241c;--glass:rgba(20,38,29,.88);--line:rgba(220,233,190,.16);--cream:#f0f5e8;--body:#d0ddc9;--quiet:#a9bba3;--lime:#a8c884;--gold:#e9c96a;--green:#55733e;--mono:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--cream);font-family:"Bricolage Grotesque","Space Grotesk",system-ui,sans-serif;font-weight:500;overscroll-behavior:none}
canvas#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(6,18,13,.45)}
#hud{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:12px;z-index:5}
#hud .stat{min-width:0}
#hud .lab{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--quiet);text-transform:uppercase}
#hud .val{font:500 17px var(--mono);white-space:nowrap}
#hud .val.sm{font-size:13px;color:var(--body)}
#cash{color:var(--cream)}
#speed{margin-left:auto;display:flex;gap:4px}
button{font:inherit;color:inherit;cursor:pointer}
#speed button{min-width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--quiet);font:500 13px var(--mono)}
#night{margin-left:6px;font-size:16px}#night.on{background:rgba(168,200,132,.16);border-color:var(--line);color:var(--gold)}
#speed button.on{background:rgba(168,200,132,.16);border-color:var(--line);color:var(--cream)}
#tip{position:fixed;left:8px;top:calc(74px + env(safe-area-inset-top));border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--body);z-index:4;border:1px solid var(--line);max-width:calc(100% - 170px);text-align:left}
#tip b{color:var(--gold);font-weight:600}
#mini{position:fixed;right:8px;top:calc(74px + env(safe-area-inset-top));width:140px;height:80px;border-radius:12px;z-index:4;touch-action:none}
#zoom{position:fixed;right:8px;top:calc(162px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:4}
#zoom button{width:44px;height:44px;border-radius:12px;font-size:20px;line-height:1}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border-radius:22px;z-index:6;max-width:560px;margin:0 auto;overflow:hidden}
#strip{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 8px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:86px;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(240,245,232,.04);padding:6px 9px;text-align:left;position:relative}
.chip .n{font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--body)}
.chip .bar{height:4px;border-radius:2px;background:rgba(240,245,232,.12);margin-top:7px;overflow:hidden}
.chip .bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:2px}
.chip.sel{background:rgba(168,200,132,.2);border-color:var(--lime)}
.chip.sel .n{color:var(--cream)}
.chip.slow::after{content:"";position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.chip.sep{margin-left:10px}
#head{display:flex;align-items:center;gap:10px;padding:4px 14px 8px}
#head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.025em}
#head .st{font:500 11px var(--mono);color:var(--quiet);margin-top:1px}
#mult{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#mult button{border:0;background:transparent;height:36px;min-width:40px;font:500 12px var(--mono);color:var(--quiet)}
#mult button.on{background:rgba(168,200,132,.18);color:var(--cream)}
#fold{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:14px}
#ups{max-height:min(34vh,300px);overflow-y:auto;padding:0 10px 10px;display:grid;gap:6px}
#sheet.folded #ups,#sheet.folded #mult{display:none}
.up{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:14px;background:rgba(240,245,232,.05);border:1px solid var(--line)}
.up .t{min-width:0;flex:1}
.up .nm{font-size:14px;font-weight:600}
.up .nm span{font:500 11px var(--mono);color:var(--lime);margin-left:6px}
.up .fx{font-size:12px;color:var(--quiet);margin-top:1px}
.up button{transition:transform .12s;flex:0 0 auto;min-width:92px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:var(--green);color:var(--cream);font:500 13px var(--mono);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.up button:active{transform:scale(.94)}.up button:disabled{background:rgba(240,245,232,.07);color:var(--quiet);box-shadow:none;cursor:default}
.up.max button{background:transparent;border-color:var(--line);color:var(--lime)}
.sec{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);padding:6px 4px 0}
#toast{position:fixed;left:50%;top:calc(132px + env(safe-area-inset-top));transform:translateX(-50%);border-radius:14px;padding:10px 14px;font-size:13.5px;z-index:8;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86vw}
#toast.on{opacity:1}
#reset{background:none;border:0;color:var(--quiet);font-size:12px;padding:8px;text-decoration:underline;justify-self:center}
@media (min-width:700px){#sheet{left:auto;right:8px;width:430px;margin:0}}
@media (max-width:699px){#ups{max-height:21vh}.up{padding:6px 6px 6px 12px}.up button{height:40px}}
@media (max-width:480px){#hud{gap:9px;padding:8px 10px}#hud .val{font-size:15px}#hud .stat.x{display:none}#speed button{min-width:36px}}
</style>
</head>
<body>
<canvas id="map" aria-label="Isometric map of the Canopy campus. Drag to pan, pinch or scroll to zoom, tap a room to upgrade it."></canvas>
<div id="hud" class="glass">
  <div class="stat"><div class="lab">Cash</div><div class="val" id="cash">$0</div></div>
  <div class="stat"><div class="lab">Per min</div><div class="val sm" id="rate">$0</div></div>
  <div class="stat x"><div class="lab">Vault</div><div class="val sm" id="jars">0</div></div>
  <div id="speed"><button data-s="0" aria-label="Pause">II</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button><button id="night" aria-label="Toggle night">☾</button></div>
</div>
<button id="tip" class="glass"></button>
<canvas id="mini" class="glass" width="280" height="160" aria-label="Minimap"></canvas>
<div id="zoom"><button class="glass" data-z="1.3" aria-label="Zoom in">+</button><button class="glass" data-z="0.77" aria-label="Zoom out">−</button><button class="glass" data-z="0" aria-label="Show whole campus">◎</button></div>
<div id="sheet" class="glass">
  <div id="strip"></div>
  <div id="head"><div><h2 id="hname"></h2><div class="st" id="hstat"></div></div>
    <div id="mult"><button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="max">Max</button></div>
    <button id="fold" aria-label="Collapse panel">▾</button></div>
  <div id="ups"></div>
</div>
<div id="toast" class="glass"></div>
<script>
(function(){'use strict';
/* ================= data ================= */
var WALLC={glass:'#2f4a3a',concrete:'#8d948f',brick:'#8e5a44',tile:'#d9dcd6',steelwall:'#6b7470',green:'#2f4a3a'};
var C={wood:'#b9895a',woodD:'#8a6240',stone:'#d9d3c4',green:'#2f4a3a',greenL:'#3f5f4a',steel:'#9aa3a0',dark:'#27332d',cream:'#efe8d6',leaf:'#5f9a4a',leaf2:'#7fb85a',bud:'#c49ad8',amber:'#d9a441',white:'#eef0ea',yellow:'#e2b93b',teal:'#7fd0d8',rust:'#b5653f'};
var STAGES=[
 {id:'seeds',wall:'concrete',fk:'epoxy',name:'Seed Vault',eq:'Seed sorters',r:[3, 4, 9, 10],floor:'#cfc8b6',base:.5,bc:6,item:C.amber,tech:[['Cold storage','cap',3],['Feminized stock','rate',2],['Heirloom genetics','price',1.15]]},
 {id:'clone',wall:'glass',fk:'tile',name:'Propagation',eq:'Clone trays',r:[13, 4, 9, 10],floor:'#d6d9cc',base:.45,bc:8,item:C.leaf2,tech:[['Humidity domes','rate',1.5],['Aeroponic cloner','rate',2],['Tissue culture','price',1.1]]},
 {id:'veg',wall:'glass',fk:'epoxy',name:'Veg Room',eq:'Veg benches',r:[23, 4, 11, 10],floor:'#dcdccf',base:.3,bc:12,item:C.leaf,tech:[['LED arrays','rate',1.5],['Auto-irrigation','rate',2],['CO₂ enrichment','rate',2]]},
 {id:'flower',wall:'glass',fk:'epoxy',name:'Flower Room',eq:'Flower beds',r:[35, 4, 13, 10],floor:'#d9d2d6',base:.22,bc:18,item:C.leaf,tech:[['Light-dep schedule','rate',1.5],['Trellis netting','rate',2],['Living soil','price',1.2]]},
 {id:'harvest',wall:'concrete',fk:'concrete',name:'Harvest Bay',eq:'Harvest tables',r:[49, 4, 12, 10],floor:'#c9c4b4',base:.35,bc:14,item:C.leaf,tech:[['Bucking machine','rate',1.5],['Wet-trim line','rate',2],['Rolling racks','cap',3]]},
 {id:'dry',wall:'brick',fk:'concrete',name:'Dry Room',eq:'Drying racks',r:[55, 18, 7, 10],floor:'#a98058',base:.28,bc:16,item:'#7d8f4a',tech:[['Dehumidifiers','rate',1.5],['Climate control','rate',2],['Slow-dry profile','price',1.15]]},
 {id:'cure',wall:'brick',fk:'wood',name:'Cure Cellar',eq:'Curing shelves',r:[48, 18, 6, 10],floor:'#96704c',base:.25,bc:20,item:'#7d8f4a',tech:[['Burp valves','rate',1.5],['Humidity packs','price',1.15],['Cellar reserve','price',1.25]]},
 {id:'trim',wall:'concrete',fk:'epoxy',name:'Trim Line',eq:'Trim stations',r:[40, 18, 7, 10],floor:'#cfc8b6',base:.35,bc:16,item:C.leaf2,tech:[['Tumble trimmer','rate',1.5],['Robot trimmers','rate',2.5],['Hand-finish','price',1.1]]},
 {id:'lab',wall:'tile',fk:'tile',name:'Test Lab',eq:'Analyzers',r:[32, 18, 7, 10],floor:'#e3e6e2',base:.4,bc:24,item:C.teal,tech:[['HPLC unit','rate',1.5],['Terpene profiling','price',1.2],['Certified labels','price',1.25]]},
 {id:'pack',wall:'concrete',fk:'concrete',name:'Pack Line',eq:'Packing arms',r:[24, 18, 7, 10],floor:'#cfc8b6',base:.35,bc:16,item:C.cream,tech:[['Auto-filler','rate',1.5],['Label printer','rate',2],['Gift packaging','price',1.15]]},
 {id:'vault',wall:'steelwall',fk:'concrete',name:'Vault',eq:'Stock runners',r:[24, 32, 10, 7],floor:'#7c857f',base:.5,bc:12,item:C.cream,tech:[['Steel shelving','cap',3],['Inventory scanners','rate',2],['Climate vault','cap',4]]}
];
var SI={};STAGES.forEach(function(s,i){SI[s.id]=i});
var STORE=[3,19,20,20],DRONE=[36,32,26,7];
var FRONT=[{id:'store',name:'Storefront',a:[13,35]},{id:'id',name:'ID Check',a:[6.5,38]},{id:'order',name:'Order Desk',a:[8.5,28.5]},{id:'pickup',name:'Pickup',a:[18,28.5]},{id:'drone',name:'Drone Wing',a:[49,35.5]}];
var ALL=STAGES.map(function(s){return {id:s.id,name:s.name,a:[s.r[0]+s.r[2]/2,s.r[1]+s.r[3]/2]}}).concat(FRONT);
var NAME={};ALL.forEach(function(a){NAME[a.id]=a});
var BASE_PRICE=6,MAXQ=8;
/* conveyor network: f = stage whose intake drives the line, z = deck height */
var SPA=16,SPB=30,SPX=63.2; /* spine A (y), spine B (y), vertical link (x) */
var BELTS=[[[6.5,SPA],[SPX,SPA]],[[SPX,SPA],[SPX,SPB]],[[SPX,SPB],[25.2,SPB]],[[25.2,SPB],[25.2,32.6]],[[24.2,34.2],[23.5,34.2],[23.5,23],[22.2,23]],[[33.6,35.4],[36.6,35.4]]];
function dockOf(i,out){var r=STAGES[i].r,top=i<5,x=top?(out?r[0]+r[2]-1.2:r[0]+1.2):(out?r[0]+1.2:r[0]+r[2]-1.2);if(i===10)return out?[r[0]+r[2]-.9,35.4]:[r[0]+1.2,r[1]+.6];return [x,top?r[1]+r[3]-.6:r[1]+r[3]-.6]}
var CONV=[],DOCKS=[],STUBS=[];
(function(){var i;for(i=1;i<=10;i++){var o=dockOf(i-1,1),n=dockOf(i,0),path=[o];
  if(i-1<5)path.push([o[0],SPA]);else path.push([o[0],SPB]);
  if(i<=4){path.push([n[0],SPA])}else if(i===5){path.push([SPX,SPA],[SPX,SPB],[n[0],SPB])}else if(i<10){path.push([n[0],SPB])}else{path.push([25.2,SPB],[25.2,n[1]])}
  if(i<10)path.push(n);else path.push([25.2,n[1]]);
  CONV.push({f:i,p:path,portal:i===10?[25.2,31.8,0]:null})}
 for(i=0;i<11;i++){if(i)DOCKS.push({p:dockOf(i,0),inn:1});if(i<10)DOCKS.push({p:dockOf(i,1),inn:0,si:i});
  var o=dockOf(i,1),n=dockOf(i,0);if(i<5){if(i)STUBS.push([[n[0],SPA],[n[0],n[1]]]);STUBS.push([[o[0],o[1]],[o[0],SPA]])}else if(i<10){STUBS.push([[n[0],SPB],[n[0],n[1]]]);STUBS.push([[o[0],o[1]],[o[0],SPB]])}}
 CONV.push({f:'seed',p:[[12.5,.4],[12.5,3.4],[4.5,3.4],[4.5,5]],portal:[4.5,4,0]});
 DOCKS.push({p:[12.5,.4],inn:0},{p:[4.5,5],inn:1});
 CONV.push({f:'store',p:[[24.2,34.2],[23.5,34.2],[23.5,23],[22.2,23]],portal:[23.85,34.2,1]});
 CONV.push({f:'drone',p:[[33.6,35.4],[36.6,35.4]],portal:[35.1,35.4,1]});
 DOCKS.push({p:[33.6,35.4],inn:0},{p:[36.6,35.4],inn:1},{p:[24.2,34.2],inn:0})})();
CONV.forEach(function(c){c.len=[0];for(var i=1;i<c.p.length;i++)c.len[i]=c.len[i-1]+Math.abs(c.p[i][0]-c.p[i-1][0])+Math.abs(c.p[i][1]-c.p[i-1][1])});

/* ================= state ================= */
var S={cash:25,total:0,u:{},buf:[],rate:0,last:Date.now(),v:1};
function U(id,k){return (S.u[id]&&S.u[id][k])||0}
function setU(id,k,v){(S.u[id]||(S.u[id]={}))[k]=v}
var speed=1,mult=1,sel='store',now=0;
try{var raw=localStorage.getItem('canopy-v2');if(raw){var o=JSON.parse(raw);if(o&&o.v===1)S=o}}catch(e){}
STAGES.forEach(function(s,i){if(typeof S.buf[i]!=='number')S.buf[i]=0});
function save(){S.last=Date.now();try{localStorage.setItem('canopy-v2',JSON.stringify(S))}catch(e){}}

/* ================= economy ================= */
function techMul(type){var m=1;STAGES.forEach(function(s){s.tech.forEach(function(t,j){if(t[1]===type&&U(s.id,'t'+j))m*=t[2]})});return m}
function stTech(s,type){var m=1;s.tech.forEach(function(t,j){if(t[1]===type&&U(s.id,'t'+j))m*=t[2]});return m}
function miles(l){return (l>=9)+(l>=24)+(l>=49)+(l>=99)}
function rateOf(s,l,st){if(l==null)l=U(s.id,'spd');if(st==null)st=U(s.id,'staff');return s.base*(1+.2*l)*Math.pow(2,miles(l))*(1+.5*st)*stTech(s,'rate')}
function capOf(s,l){if(l==null)l=U(s.id,'cap');return 20*(1+l)*stTech(s,'cap')}
function price(){return BASE_PRICE*techMul('price')*(1+.02*U('cure','spd'))*(1+.02*U('lab','spd'))*(U('store','t1')?1.1:1)}
function arrival(){return .18*(1+.15*U('store','mkt'))*(U('store','t0')?1.5:1)*(U('store','t2')?2:1)}
function idN(){return 1+U('id','n')} function ordN(){return 1+U('order','n')} function pikN(){return 1+U('pickup','n')}
function idT(){return 2.4/(1+.12*U('id','spd'))/(U('id','t0')?2:1)}
function ordT(){return 4/(1+.12*U('order','spd'))/(U('order','t0')?2:1)}
function pikT(){return 3/(1+.12*U('pickup','spd'))/(U('pickup','t0')?2:1)}
function basket(){return 1+U('pickup','bsk')}
function idCap(){return 6+2*U('store','q')}
function drones(){return U('drone','n')} function payload(){return 2+2*U('drone','pay')}
function flightT(){return 14/(1+.15*U('drone','spd'))}
function dronePay(){return 1.5*(U('drone','t0')?1.5:1)}
function bottleneck(){
  var mi=0,mr=1e99;STAGES.forEach(function(s,i){var r=rateOf(s);if(r<mr){mr=r;mi=i}});
  var f=[['store',arrival()],['id',idN()/idT()],['order',ordN()/ordT()],['pickup',pikN()/pikT()]],fm=f[0];
  f.forEach(function(x){if(x[1]<fm[1])fm=x});
  var demand=fm[1]*basket()+drones()*payload()/(flightT()+2);
  return mr<demand?STAGES[mi].id:(drones()===0&&S.total>1500?'drone':fm[0]);
}
var GEO=function(b,g){return function(l){return b*Math.pow(g,l)}};
function upsFor(id){
  var i=SI[id],L=[];
  if(i!=null){var s=STAGES[i];
    L.push({k:'spd',name:s.eq,max:200,cost:GEO(s.bc,1.13),fx:function(l){var nx=[9,24,49,99].filter(function(m){return m>l})[0];return fr(rateOf(s,l))+'/s → '+fr(rateOf(s,l+1))+'/s'+(nx!=null?' · ×2 at Lv '+(nx+1):'')}});
    L.push({k:'staff',name:'Crew',max:8,cost:GEO(s.bc*12,2.4),fx:function(l){return (l+1)+' on shift · +50% speed each'}});
    L.push({k:'cap',name:'Output storage',max:40,cost:GEO(s.bc*4,1.5),fx:function(l){return 'Holds '+fr(capOf(s,l))+' → '+fr(capOf(s,l+1))}});
    s.tech.forEach(function(t,j){L.push({k:'t'+j,name:t[0],max:1,tech:1,cost:function(){return s.bc*[50,600,8000][j]},fx:function(){return t[1]==='rate'?'×'+t[2]+' room speed':t[1]==='cap'?'×'+t[2]+' storage':'+'+Math.round((t[2]-1)*100)+'% jar price'}})});
  }else if(id==='store'){
    L.push({k:'mkt',name:'Marketing',max:100,cost:GEO(20,1.22),fx:function(){return fr(arrival()*60)+' walk-ins / min'}});
    L.push({k:'q',name:'Sidewalk queue',max:5,cost:GEO(150,3),fx:function(){return idCap()+' can wait outside'}});
    L.push({k:'t0',name:'Neon sign',max:1,tech:1,cost:function(){return 400},fx:function(){return '×1.5 walk-ins'}});
    L.push({k:'t1',name:'Loyalty app',max:1,tech:1,cost:function(){return 5e3},fx:function(){return '+10% jar price'}});
    L.push({k:'t2',name:'Street mural',max:1,tech:1,cost:function(){return 5e4},fx:function(){return '×2 walk-ins'}});
  }else if(id==='id'){
    L.push({k:'n',name:'ID scanners',max:2,cost:GEO(300,10),fx:function(l){return (l+1)+' lane'+(l?'s':'')+' open'}});
    L.push({k:'spd',name:'Scan speed',max:60,cost:GEO(15,1.18),fx:function(){return idT().toFixed(2)+'s per check'}});
    L.push({k:'t0',name:'Fast-pass lane',max:1,tech:1,cost:function(){return 3e3},fx:function(){return '×2 check speed'}});
  }else if(id==='order'){
    L.push({k:'n',name:'Registers',max:2,cost:GEO(250,8),fx:function(l){return (l+1)+' open'}});
    L.push({k:'spd',name:'Budtender training',max:60,cost:GEO(18,1.18),fx:function(){return ordT().toFixed(2)+'s per order'}});
    L.push({k:'t0',name:'Tablet menus',max:1,tech:1,cost:function(){return 4e3},fx:function(){return '×2 order speed'}});
  }else if(id==='pickup'){
    L.push({k:'n',name:'Pickup counters',max:2,cost:GEO(250,8),fx:function(l){return (l+1)+' open'}});
    L.push({k:'spd',name:'Fulfilment speed',max:60,cost:GEO(18,1.18),fx:function(){return pikT().toFixed(2)+'s per handoff'}});
    L.push({k:'bsk',name:'Basket size',max:7,cost:GEO(120,3.2),fx:function(l){return (l+1)+' jar'+(l?'s':'')+' per customer'}});

document.addEventListener('visibilitychange',function(){if(document.hidden)save();else{away();lastT=performance.now()}});
window.addEventListener('pagehide',save);window.addEventListener('resize',function(){resize();clampCam()});
W=window.innerWidth;resize();buildStrip();syncWorld();select('store',false);
if(!S.total){lookAt(12,48,W<700?1.1:1.3,false);setTimeout(function(){lookAt(10,34,W<700?1.55:1.8,true)},900)}else lookAt(10,34,W<700?1.55:1.8,false);away();
if(!S.total)setTimeout(function(){toast('Drag to explore the campus · tap any room to upgrade it')},600);
window.__canopy={counts:function(){syncWorld();return {prims:prims.length,decals:decals.length,shadows:shadows.length,glows:glows.length,fn:prims.filter(function(p){return p.k===2}).length,boxes:prims.filter(function(p){return p.k===0}).length,blobs:prims.filter(function(p){return p.k===1}).length}},S:S,tick:tick,lookAt:lookAt,select:select,cam:cam,minZ:minZ};
requestAnimationFrame(frame);
})();
