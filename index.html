<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#10110e" />
  <meta name="description" content="Build and automate a tactile 3D isometric factory." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310110e'/%3E%3Cpath d='M10 49V27l13 7V23l13 7V15h10v34z' fill='%23d7ff43'/%3E%3C/svg%3E" />
  <title>SHIFT — 3D Idle Factory</title>
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="brand"><span>S</span><b>SHIFT</b></div>
      <div class="stat"><small>CASH</small><strong id="money">$0</strong></div>
      <div class="stat output"><small>OUTPUT</small><strong id="rate">$0/s</strong></div>
      <button class="icon" id="resetOpen" aria-label="Reset progress">↻</button>
    </header>

    <section class="world" id="world" aria-label="Interactive 3D factory. Drag to rotate and tap machines to select them.">
      <div class="loading" id="loading"><span></span>BUILDING FACTORY</div>
      <div class="markers" id="markers"></div>
      <div class="gesture-hint" id="gestureHint">DRAG TO ROTATE · TAP A MACHINE</div>
      <button class="run" id="run"><b>RUN</b><span id="tapValue">+$1</span></button>
      <div class="float-layer" id="floatLayer"></div>
    </section>

    <section class="sheet" id="sheet">
      <div class="handle"></div>
      <div class="machine-info">
        <div><small id="machineNumber">MACHINE 01</small><h1 id="machineName">ORE CRUSHER</h1></div>
        <div class="level"><small>LEVEL</small><b id="machineLevel">0</b></div>
      </div>
      <div class="machine-stats">
        <span><small>PRODUCES</small><b id="machineRate">$0/s</b></span>
        <button class="buy" id="buyMachine"><span>BUILD</span><b id="machineCost">$10</b></button>
      </div>
      <div class="order-row">
        <div class="order"><small id="orderName">FIRST BATCH</small><span><i id="orderFill"></i></span><b id="orderProgress">$0 / $100</b></div>
        <button id="claim" disabled>CLAIM <b id="claimReward">+$40</b></button>
        <button class="boost" id="boost"><span>BOOST ALL</span><b id="boostCost">$250</b></button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-wrap" id="resetModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
      <small>RESET FACTORY</small><h2 id="resetTitle">Start over?</h2><p>This clears every machine, upgrade, and order.</p>
      <div><button id="resetCancel">CANCEL</button><button class="danger" id="resetConfirm">RESET</button></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
